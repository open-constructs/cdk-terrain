name: Release
on:
  push:
    branches:
      - main
      - backport-release-*
  workflow_dispatch: {}

env:
  HUSKY: "0"
  SENTRY_ORG: cdktn
  SENTRY_PROJECT: cdktn

concurrency:
  group: release

jobs:
  # ---------------------------------------------------------------------------
  # Stable channel: publishes the version already in package.json (skipped if
  # Sentry already shows a finalized release for that version).
  # ---------------------------------------------------------------------------
  prepare-release:
    if: github.repository == 'open-constructs/cdk-terrain'
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.build-test-matrix.outputs.tests }}
      version: ${{ steps.get_version.outputs.version }}
      release_status: ${{ steps.get_release_status.outputs.release }}
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    env:
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # gives sentry access to all previous commits
      - name: "Add Git safe.directory" # Go 1.18+ started embedding repo info in the build and e.g. building @cdktn/hcl2json fails without this
        # The Sentry CLI also requires this, https://github.com/actions/checkout/issues/760
        run: git config --global --add safe.directory /__w/cdk-terrain/cdk-terrain
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: version
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> $GITHUB_OUTPUT
      - name: release status
        id: get_release_status
        run: |
          status=$(sentry-cli releases list | grep 'cdktn-cli-${{ steps.get_version.outputs.version }} ' | grep -v 'unreleased' > /dev/null && echo 'released' || echo 'unreleased')
          echo "Sentry returned: ${status}"
          echo "release=${status}" >> $GITHUB_OUTPUT
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: Create a release
        if: steps.get_release_status.outputs.release == 'unreleased'
        run: sentry-cli releases new cdktn-cli-${{ steps.get_version.outputs.version }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: create bundle
        if: steps.get_release_status.outputs.release == 'unreleased'
        run: |
          pnpm ci
          node tools/align-version.mjs
          pnpm run build
          pnpm run package
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Add sourcemap and commit info to sentry
        if: steps.get_release_status.outputs.release == 'unreleased'
        run: |
          sentry-cli releases files cdktn-cli-${{ steps.get_version.outputs.version }} upload-sourcemaps ./packages/cdktn-cli/bundle
          sentry-cli releases set-commits --auto cdktn-cli-${{ steps.get_version.outputs.version }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: Upload artifact
        if: steps.get_release_status.outputs.release == 'unreleased'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-release
          path: dist
      - name: Upload edge-provider bindings
        if: steps.get_release_status.outputs.release == 'unreleased'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-provider-bindings-release
          path: packages/@cdktn/provider-generator/edge-provider-bindings

  # ---------------------------------------------------------------------------
  # Next channel: always bumps to a fresh prerelease version on each push to
  # main and publishes with the `next` dist-tag. Skipped on backport branches.
  # ---------------------------------------------------------------------------
  prepare-next:
    if: github.repository == 'open-constructs/cdk-terrain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tests: ${{ steps.build-test-matrix.outputs.tests }}
      version: ${{ steps.get_version.outputs.version }}
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    env:
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # gives standard-version access to all previous commits
      - name: "Add Git safe.directory" # Go 1.18+ started embedding repo info in the build and e.g. building @cdktn/hcl2json fails without this
        # The Sentry CLI also requires this, https://github.com/actions/checkout/issues/760
        run: git config --global --add safe.directory /__w/cdk-terrain/cdk-terrain
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: installing dependencies
        run: pnpm ci
      - name: Configure git user
        run: |
          git config user.name github-team-tf-cdk
          git config user.email github-team-tf-cdk@hashicorp.com
      - name: Bump prerelease version
        run: |
          pnpm prepare-next-release
          node tools/align-version.mjs
      - name: version
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> $GITHUB_OUTPUT
      - name: release status
        id: get_release_status
        run: |
          status=$(sentry-cli releases list | grep 'cdktn-cli-${{ steps.get_version.outputs.version }} ' | grep -v 'unreleased' > /dev/null && echo 'released' || echo 'unreleased')
          echo "Sentry returned: ${status}"
          echo "release=${status}" >> $GITHUB_OUTPUT
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: Create a release
        if: steps.get_release_status.outputs.release == 'unreleased'
        run: sentry-cli releases new cdktn-cli-${{ steps.get_version.outputs.version }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: create bundle
        run: |
          pnpm ci
          pnpm run build
          pnpm run package
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      - name: Add sourcemap and commit info to sentry
        if: steps.get_release_status.outputs.release == 'unreleased'
        run: |
          sentry-cli releases files cdktn-cli-${{ steps.get_version.outputs.version }} upload-sourcemaps ./packages/cdktn-cli/bundle
          sentry-cli releases set-commits --auto cdktn-cli-${{ steps.get_version.outputs.version }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-next
          path: dist
      - name: Upload edge-provider bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-provider-bindings-next
          path: packages/@cdktn/provider-generator/edge-provider-bindings
      - name: publish tag
        run: git push --follow-tags

  # ---------------------------------------------------------------------------
  # Test fan-out — release channel
  # ---------------------------------------------------------------------------
  integration_test:
    uses: ./.github/workflows/integration.yml
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    with:
      skip_setup: true
      concurrency_group_prefix: release
      dist_artifact_name: dist-release
      edge_bindings_artifact_name: edge-provider-bindings-release
    secrets: inherit

  provider_integration_test:
    needs:
      - prepare-release
    uses: ./.github/workflows/provider-integration.yml
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    with:
      concurrency_group_prefix: release
      skip_setup: true
      dist_artifact_name: dist-release
    secrets: inherit

  examples:
    needs:
      - prepare-release
    uses: ./.github/workflows/examples.yml
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    with:
      concurrency_group_prefix: release
    secrets: inherit

  quality:
    needs:
      - prepare-release
    uses: ./.github/workflows/quality.yml
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    with:
      concurrency_group_prefix: release
    secrets: inherit

  unit_test:
    uses: ./.github/workflows/unit.yml
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            cdktn,
            cdktn-cli,
            "@cdktn/hcl2cdk",
            "@cdktn/hcl2json",
            "@cdktn/provider-generator",
            "@cdktn/provider-schema",
            "@cdktn/commons",
            "@cdktn/cli-core",
          ]
        terraform_version: ["1.6.5", "1.5.5"]
    with:
      concurrency_group_prefix: release
      package: ${{ matrix.package }}
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Test fan-out — next channel
  # ---------------------------------------------------------------------------
  unit_test_next:
    uses: ./.github/workflows/unit.yml
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            cdktn,
            cdktn-cli,
            "@cdktn/hcl2cdk",
            "@cdktn/hcl2json",
            "@cdktn/provider-generator",
            "@cdktn/provider-schema",
            "@cdktn/commons",
            "@cdktn/cli-core",
          ]
        terraform_version: ["1.6.5", "1.5.5"]
    with:
      concurrency_group_prefix: release-next
      package: ${{ matrix.package }}
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  quality_next:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    with:
      concurrency_group_prefix: release-next
    secrets: inherit

  integration_test_next:
    needs:
      - prepare-next
    uses: ./.github/workflows/integration.yml
    with:
      skip_setup: true
      concurrency_group_prefix: release-next
      dist_artifact_name: dist-next
      edge_bindings_artifact_name: edge-provider-bindings-next
    secrets: inherit

  provider_integration_test_next:
    needs:
      - prepare-next
    uses: ./.github/workflows/provider-integration.yml
    with:
      skip_setup: true
      concurrency_group_prefix: release-next
      dist_artifact_name: dist-next
    secrets: inherit

  examples_next:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/examples.yml
    with:
      concurrency_group_prefix: release-next
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Release — main channel
  # ---------------------------------------------------------------------------
  release_github:
    name: Release to Github
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    needs:
      - prepare-release
      - integration_test
      - provider_integration_test
      - unit_test
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: installing dependencies
        run: pnpm ci
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-release
      - name: Release to github
        run: pnpm run release-github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Mark merged release PR as tagged
        # skip-github-release in release-please-config.json means release-please
        # never sees this release finalized, so it never flips the merged release
        # PR's label from "autorelease: pending" to "autorelease: tagged" itself.
        # Without this, release-please permanently refuses to open the next
        # release PR ("There are untagged, merged release PRs outstanding").
        # The "autorelease: tagged" label itself is created once, repo-wide.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          if [ -z "${pr}" ]; then
            echo "No pull request associated with ${{ github.sha }}, skipping relabel"
            exit 0
          fi
          gh pr edit "${pr}" -R "${{ github.repository }}" --remove-label "autorelease: pending" --add-label "autorelease: tagged"

  publish_release:
    permissions:
      contents: read
      id-token: write
    needs:
      - prepare-release
      - integration_test
      - provider_integration_test
      - unit_test
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    uses: ./.github/workflows/release-publish.yml
    with:
      channel: release
      dist_artifact_name: dist-release
    secrets: inherit

  release_sentry:
    name: Finalize the sentry release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - integration_test
      - provider_integration_test
      - unit_test
      - publish_release
    if: needs.prepare-release.outputs.release_status == 'unreleased'
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: version
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> $GITHUB_OUTPUT
      - name: release status
        id: get_release_status
        run: |
          status=$(sentry-cli releases list | grep 'cdktn-cli-${{ steps.get_version.outputs.version }} ' | grep -q 'unreleased' && echo "unreleased" || echo "released")
          echo "Sentry returned: ${status}"
          echo "release=${status}" >> $GITHUB_OUTPUT
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: Finalize the release
        if: steps.get_release_status.outputs.release == 'unreleased'
        run: sentry-cli releases finalize cdktn-cli-${{ steps.get_version.outputs.version }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Release — next
  # ---------------------------------------------------------------------------
  publish_next:
    permissions:
      contents: read
      id-token: write
    needs:
      - prepare-next
      - integration_test_next
      - provider_integration_test_next
      - unit_test_next
    uses: ./.github/workflows/release-publish.yml
    with:
      channel: next
      dist_artifact_name: dist-next
      npm_dist_tag: next
    secrets: inherit

  release_sentry_next:
    name: Finalize the sentry release (next)
    needs:
      - prepare-next
      - integration_test_next
      - provider_integration_test_next
      - unit_test_next
      - publish_next
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: version
        id: get_version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> $GITHUB_OUTPUT
      - name: release status
        id: get_release_status
        run: |
          status=$(sentry-cli releases list | grep 'cdktn-cli-${{ steps.get_version.outputs.version }} ' | grep -q 'unreleased' && echo "unreleased" || echo "released")
          echo "Sentry returned: ${status}"
          echo "release=${status}" >> $GITHUB_OUTPUT
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
      - name: Finalize the release
        if: steps.get_release_status.outputs.release == 'unreleased'
        run: sentry-cli releases finalize cdktn-cli-${{ steps.get_version.outputs.version }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}

  # ---------------------------------------------------------------------------
  # Failure reporting
  # ---------------------------------------------------------------------------
  report:
    name: Report status
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    needs:
      - prepare-release
      - prepare-next
      - integration_test
      - provider_integration_test
      - unit_test
      - quality
      - examples
      - integration_test_next
      - provider_integration_test_next
      - unit_test_next
      - quality_next
      - examples_next
      - release_github
      - publish_release
      - release_sentry
      - publish_next
      - release_sentry_next
    steps:
      - name: Send failures to Slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.FAILURE_SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "name": "main",
              "run_url": "https://github.com/open-constructs/cdk-terrain/actions/runs/${{ github.run_id }}"
            }
