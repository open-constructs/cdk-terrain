name: Quality
on:
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      concurrency_group_prefix:
        default: pr
        required: false
        type: string

env:
  HUSKY: "0"

concurrency:
  group: ${{ inputs.concurrency_group_prefix }}-quality-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:62c00a313a1c9457c0d8d3b6ee86c77d241c2d18c4cc1f9b9015836d6d6a98c8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Run prettier
        run: pnpm run lint:prettier

  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:62c00a313a1c9457c0d8d3b6ee86c77d241c2d18c4cc1f9b9015836d6d6a98c8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: "Add Git safe.directory"
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Derive SHAs for nx affected
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Run lint (affected)
        if: github.event_name == 'pull_request'
        run: pnpm exec nx affected -t lint --parallel=3 --format=gha --base="$NX_BASE" --head="$NX_HEAD"
      - name: Run lint (all)
        if: github.event_name != 'pull_request'
        run: pnpm exec nx run-many -t lint --parallel=3 --format=gha

  knip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: Install dependencies
        run: pnpm ci
      - name: Install test dependencies
        run: cd test && pnpm ci
      - name: Run knip
        run: pnpm exec knip --reporter github-actions --reporter symbols
