name: docker

on:
  push:
    branches: main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "website/**"
      - "cdk.tf/**"
      - "tools/update-github-project-board/**"
  workflow_dispatch: {}

jobs:
  build-docker-image:
    # The push trigger is already limited to main, but workflow_dispatch accepts
    # any ref. Without the ref guard a manual dispatch from an arbitrary branch
    # would publish :latest through this job's packages:write token.
    if: github.repository == 'open-constructs/cdk-terrain' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tf-versions
        run: |
          DEFAULT_TERRAFORM_VERSION=$(cat .terraform.versions.json | jq -r '.default')
          AVAILABLE_TERRAFORM_VERSIONS=$(cat .terraform.versions.json | jq -r '.available | join(" ")')
          DEFAULT_OPENTOFU_VERSION=$(cat .terraform.versions.json | jq -r '.opentofu.default')
          AVAILABLE_OPENTOFU_VERSIONS=$(cat .terraform.versions.json | jq -r '.opentofu.available | join(" ")')
          echo "default=$DEFAULT_TERRAFORM_VERSION" >> $GITHUB_OUTPUT
          echo "available=$AVAILABLE_TERRAFORM_VERSIONS" >> $GITHUB_OUTPUT
          echo "tofu-default=$DEFAULT_OPENTOFU_VERSION" >> $GITHUB_OUTPUT
          echo "tofu-available=$AVAILABLE_OPENTOFU_VERSIONS" >> $GITHUB_OUTPUT
      - id: cdktn-version
        run: |
          CDKTF_VERSION=$(cat package.json | jq -r '.version')
          echo "cdktn=$CDKTF_VERSION" >> $GITHUB_OUTPUT
      - id: git-sha
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          echo "git-sha=$GIT_SHA" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          pull: true
          push: true
          tags: |
            ghcr.io/open-constructs/jsii-terraform:latest
            ghcr.io/open-constructs/jsii-terraform:${{ steps.cdktn-version.outputs.cdktn }}
            ghcr.io/open-constructs/jsii-terraform:${{ steps.cdktn-version.outputs.cdktn }}-${{ steps.git-sha.outputs.git-sha }}
          # Registry-backed layer cache instead of the GitHub Actions cache:
          # writing to it requires packages:write, which only this workflow's
          # token has, so it cannot be poisoned from less-privileged contexts
          # (zizmor cache-poisoning).
          cache-from: type=registry,ref=ghcr.io/open-constructs/jsii-terraform:buildcache
          cache-to: type=registry,ref=ghcr.io/open-constructs/jsii-terraform:buildcache,mode=max
          build-args: |
            DEFAULT_TERRAFORM_VERSION=${{ steps.tf-versions.outputs.default }}
            AVAILABLE_TERRAFORM_VERSIONS=${{ steps.tf-versions.outputs.available }}
            DEFAULT_OPENTOFU_VERSION=${{ steps.tf-versions.outputs.tofu-default }}
            AVAILABLE_OPENTOFU_VERSIONS=${{ steps.tf-versions.outputs.tofu-available }}
