name: Pnpm Upgrade

on:
  schedule:
    # At 04:04 every Monday
    - cron: 4 4 * * 1
  workflow_dispatch: {}

# We special-case @types/node because we want to stay on the current major (minimum supported node release)
# We special-case @types/node further because of an incompatibility with https-proxy-agent
# We special-case @types/fs-extra because the current major (9.x) is broken with @types/node >= 10
# We special-case typescript because it's not semantically versioned
# We special-case constructs because we want to stay in control of the minimum compatible version
# We special-case graphology-types because the newer version has type definitions that are not compatible with our typescript version.
# We special-case @types/prettier because the underlying TS types aren't supported by our TS version anymore since prettier v2.6.1

env:
  HUSKY: "0"

jobs:
  upgradeRoot:
    name: Pnpm Upgrade Root
    # Only run on the canonical repo
    if: github.repository == 'open-constructs/cdk-terrain'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    steps:
      - name: Check Out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: Install Tools
        run: |-
          npm -g install npm-check-updates@22.2.9
      # Install first so `nx` is available for the package listing below.
      - name: Run "pnpm install"
        run: pnpm install --prefer-offline
      - name: List Mono-Repo Packages
        id: list-packages
        # These need to be ignored from the `ncu` runs!
        run: |-
          echo "list=$(pnpm exec nx show projects --json | jq -r 'join(",")')" >> $GITHUB_OUTPUT
      - name: Run "ncu -u"
        run: |-
          # Upgrade dependencies at repository root
          ncu --upgrade --filter=@types/fs-extra --target=minor --packageManager pnpm --dep prod,dev,optional,peer --no-deprecated
          ncu --upgrade --filter=typescript --target=patch --packageManager pnpm --dep prod,dev,optional,peer --no-deprecated
          ncu --upgrade --reject=@types/node,@types/fs-extra,constructs,typescript,@types/prettier --target=minor \
            --packageManager pnpm --dep prod,dev,optional,peer --no-deprecated

      # Refresh the lockfile after the ncu edits above (necessary for "pnpm update" to run)
      - name: Run "pnpm install"
        run: pnpm install --prefer-offline --no-frozen-lockfile

      # Next, create and upload the changes as a patch file. This will later be downloaded to create a pull request
      # Creating a pull request requires write permissions and it's best to keep write privileges isolated.
      - name: Create Patch
        run: |-
          git add .
          git diff --patch --staged > ./upgrade.patch
      - name: Upload Patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade.patch
          path: ./upgrade.patch

  prRoot:
    name: Create Pull Request Root
    needs: upgradeRoot
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: upgrade.patch

      - name: Apply patch
        run: '[ -s ./upgrade.patch ] && git apply ./upgrade.patch || echo "Empty patch. Skipping."'

      - name: Remove patch file
        run: rm -f ./upgrade.patch

      - name: Mint CDKTN maintainers App token
        id: app-token
        # Pin maintained by Dependabot (github-actions). See .github/dependabot.yml
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CDKTN_MAINTAINERS_APP_ID }}
          private-key: ${{ secrets.CDKTN_MAINTAINERS_APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get_user_id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Make Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Git commit details
          branch: automation/pnpm-upgrade
          commit-message: |-
            chore: npm-check-updates && pnpm update
            Ran npm-check-updates and pnpm update to keep the `pnpm-lock.yaml` file up-to-date.
          # Pull Request details
          title: "chore: npm-check-updates && pnpm update"
          body: |-
            Ran npm-check-updates and pnpm update to keep the `pnpm-lock.yaml` file up-to-date.
          labels: dependencies,auto-approve,ci/run-all
          team-reviewers: cdktn-maintainers
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get_user_id.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get_user_id.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>

  upgradePackage:
    name: Pnpm Upgrade Package
    # Only run on the canonical repo
    if: github.repository == 'open-constructs/cdk-terrain'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    strategy:
      fail-fast: false
      matrix:
        pr: [
            { name: "cli", packages: ["cdktn-cli", "@cdktn/cli-core"] },
            # A dumb hack to make the resulting expansion expression work since { cdktn }
            # searches for the literal string, whereas { cdktn, cdktn } searches for either cdktn or cdktn
            { name: "lib", packages: ["cdktn", "cdktn"] },
            {
              name: "util",
              packages:
                [
                  "@cdktn/hcl2cdk",
                  "@cdktn/hcl2json",
                  "@cdktn/provider-schema",
                  "@cdktn/provider-generator",
                  "@cdktn/commons",
                ],
            },
            # Sometimes we are very lucky and all packages can be updated in one go
            # We should take the chance and spare us some rebases
            {
              name: "all",
              packages:
                [
                  "cdktn-cli",
                  "@cdktn/cli-core",
                  "cdktn",
                  "@cdktn/hcl2cdk",
                  "@cdktn/hcl2json",
                  "@cdktn/provider-schema",
                  "@cdktn/provider-generator",
                  "@cdktn/commons",
                ],
            },
          ]
    steps:
      - name: Check Out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: Install Tools
        run: |-
          npm -g install npm-check-updates@22.2.9
      # Install first so `nx` is available for the package listing below.
      - name: Run "pnpm install"
        run: pnpm install --prefer-offline
      - name: List Mono-Repo Packages
        id: list-packages
        # These need to be ignored from the `ncu` runs!
        run: |-
          echo "list=$(pnpm exec nx show projects --json | jq -r 'join(",")')" >> $GITHUB_OUTPUT
      - name: Run "ncu -u"
        shell: bash
        env:
          NCU_WORKSPACES: ${{ join(matrix.pr.packages, ' ') }}
        run: |-
          read -ra workspaces <<< "$NCU_WORKSPACES"
          workspace_args=()
          for workspace in "${workspaces[@]}"; do
            workspace_args+=(--workspace "$workspace")
          done

          ncu --upgrade "${workspace_args[@]}" --no-root \
            --filter=@types/fs-extra --target=minor \
            --packageManager pnpm --dep prod,dev,optional,peer --no-deprecated

          ncu --upgrade "${workspace_args[@]}" --no-root \
            --filter=typescript --target=patch \
            --packageManager pnpm --dep prod,dev,optional,peer --no-deprecated

          ncu --upgrade "${workspace_args[@]}" --no-root \
            --reject='@types/node,@types/fs-extra,constructs,typescript,graphology-types,jsii,jsii-pacmak,jsii-rosetta,jsii-docgen,codemaker,${{ steps.list-packages.outputs.list }}' \
            --target=minor \
            --packageManager pnpm --dep prod,dev,optional,peer --no-deprecated

      # Refresh the lockfile after the ncu edits above (necessary for "pnpm update" to run)
      - name: Run "pnpm install"
        run: pnpm install --prefer-offline --no-frozen-lockfile

      - name: Mint CDKTN maintainers App token
        id: app-token
        # Pin maintained by Dependabot (github-actions). See .github/dependabot.yml
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CDKTN_MAINTAINERS_APP_ID }}
          private-key: ${{ secrets.CDKTN_MAINTAINERS_APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get_user_id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Make Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Git commit details
          branch: automation/pnpm-upgrade-${{ matrix.pr.name }}
          commit-message: |-
            chore: Upgrade dependencies for ${{matrix.pr.name}}
            Ran npm-check-updates and pnpm update to keep the `pnpm-lock.yaml` file up-to-date.
          # Pull Request details
          title: "chore: Upgrade dependencies for ${{matrix.pr.name}}"
          body: |-
            Ran npm-check-updates and pnpm update to keep the `pnpm-lock.yaml` file up-to-date.
            This PR touches the following packages:

            ${{ join(matrix.pr.packages, '\n -')}}

          labels: dependencies,auto-approve
          team-reviewers: cdktn-maintainers
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get_user_id.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get_user_id.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>

  upgradeJSII:
    name: Pnpm Upgrade JSII
    # Only run on the canonical repo
    if: github.repository == 'open-constructs/cdk-terrain'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    steps:
      - name: Check Out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: Install Tools
        run: |-
          npm -g install npm-check-updates@22.2.9
      # Install first so `nx` is available for the package listing below.
      - name: Run "pnpm install"
        run: pnpm install --prefer-offline
      - name: List Mono-Repo Packages
        id: list-packages
        # These need to be ignored from the `ncu` runs!
        run: |-
          echo "list=$(pnpm exec nx show projects --json | jq -r 'join(",")')" >> $GITHUB_OUTPUT
      - name: Run "ncu -u"
        run: |-
          # Upgrade all the packages
          ncu --upgrade --workspaces --root \
            --filter='jsii,jsii-pacmak,jsii-rosetta,jsii-docgen,codemaker,constructs' \
            --target=minor \
            --packageManager pnpm --dep prod,dev,optional,peer --no-deprecated
      # Refresh the lockfile after the ncu edits above (necessary for "pnpm update" to run)
      - name: Run "pnpm install"
        run: pnpm install --prefer-offline --no-frozen-lockfile

      - name: Mint CDKTN maintainers App token
        id: app-token
        # Pin maintained by Dependabot (github-actions). See .github/dependabot.yml
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CDKTN_MAINTAINERS_APP_ID }}
          private-key: ${{ secrets.CDKTN_MAINTAINERS_APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get_user_id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Make Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Git commit details
          branch: automation/pnpm-upgrade-jsii
          commit-message: |-
            chore: Upgrade dependencies for JSII
            Ran npm-check-updates and pnpm update to keep the `pnpm-lock.yaml` file up-to-date.
          # Pull Request details
          title: "chore: Upgrade dependencies for JSII"
          body: |-
            Ran npm-check-updates and pnpm update to keep the `pnpm-lock.yaml` file up-to-date.
            This PR updates JSII across all packages.

          labels: dependencies,auto-approve
          team-reviewers: cdktn-maintainers
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get_user_id.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get_user_id.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
