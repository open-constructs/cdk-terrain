name: Telemetry E2E
on:
  workflow_call:
    inputs:
      concurrency_group_prefix:
        default: pr
        required: false
        type: string

env:
  HUSKY: "0"

concurrency:
  group: ${{ inputs.concurrency_group_prefix }}-telemetry-e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-e2e:
    name: "Telemetry delivery e2e"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:62c00a313a1c9457c0d8d3b6ee86c77d241c2d18c4cc1f9b9015836d6d6a98c8
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: "Add Git safe.directory" # Go 1.18+ embeds repo info in builds
        run: git config --global --add safe.directory /__w/cdk-terrain/cdk-terrain
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      - name: Get cache directory paths
        id: global-cache-dir-path
        run: |
          mkdir -p /usr/local/share/.cache/go
          echo "go=/usr/local/share/.cache/go" >> $GITHUB_OUTPUT
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.global-cache-dir-path.outputs.go }}
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-telemetry-e2e
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-
      - name: install dependencies
        run: pnpm ci
      - name: build the CLI and its dependencies
        run: pnpm exec nx build cdktn-cli
        env:
          GOCACHE: ${{ steps.global-cache-dir-path.outputs.go }}
      # No SENTRY_DSN and no CHECKPOINT_DISABLE here: the script bakes a
      # local-sink DSN into its own scratch bundle and needs telemetry on.
      - name: telemetry delivery e2e
        run: bash tools/validate-sentry-e2e.sh
        timeout-minutes: 10
