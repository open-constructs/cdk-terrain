name: Unit Tests - PR
on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - reopened

jobs:
  determine-affected:
    name: "Determine Affected Packages"
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci/skip-unit') }}
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      has_packages: ${{ steps.affected.outputs.has_packages }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --prefer-offline
      - name: Determine affected packages
        id: affected
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci/run-all-unit') }}" == "true" ]]; then
            echo "Label ci/run-all-unit detected, running all packages"
            PACKAGES='["cdktn","cdktn-cli","@cdktn/hcl2cdk","@cdktn/hcl2json","@cdktn/provider-schema","@cdktn/provider-generator","@cdktn/commons","@cdktn/cli-core"]'
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            else
              BASE_SHA="${{ github.event.merge_group.base_sha }}"
            fi
            PACKAGES=$(bash tools/affected-packages.sh "$BASE_SHA")
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          if [[ "$PACKAGES" == "[]" ]]; then
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Affected packages: $PACKAGES"

  all_unit_tests:
    name: "All Unit Tests"
    needs: determine-affected
    if: ${{ needs.determine-affected.outputs.has_packages == 'true' }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.determine-affected.outputs.packages) }}
        terraform_version: ["1.6.5", "1.5.5"]
    with:
      concurrency_group_prefix: pr-all
      package: ${{ matrix.package }}
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  cdktn_cli_core:
    name: "@cdktn/cli Unit Tests"
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci/run-unit/@cdktn/cli-core') }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.5"]
    with:
      concurrency_group_prefix: pr-cdktn-cli-core
      package: "@cdktn/cli-core"
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  cdktn_commons:
    name: "@cdktn/commons Unit Tests"
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci/run-unit/@cdktn/commons') }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.5"]
    with:
      concurrency_group_prefix: pr-cdktn-commons
      package: "@cdktn/commons"
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  cdktn_hcl2cdk:
    name: "@cdktn/hcl2cdk Unit Tests"
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci/run-unit/@cdktn/hcl2cdk') }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.5"]
    with:
      concurrency_group_prefix: pr-cdktn-hcl2cdk
      package: "@cdktn/hcl2cdk"
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  cdktn_hcl2json:
    name: "@cdktn/hcl2json Unit Tests"
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci/run-unit/@cdktn/hcl2json') }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.5"]
    with:
      concurrency_group_prefix: pr-cdktn-hcl2json
      package: "@cdktn/hcl2json"
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  cdktn_provider_generator:
    name: "@cdktn/provider-generator Unit Tests"
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci/run-unit/@cdktn/provider-generator') }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.5"]
    with:
      concurrency_group_prefix: pr-cdktn-provider-generator
      package: "@cdktn/provider-generator"
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  cdktn_cli:
    name: "cdktn-cli Unit Tests"
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci/run-unit/cdktn-cli') }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.5"]
    with:
      concurrency_group_prefix: pr-cdktn-cli
      package: "cdktn-cli"
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  cdktn:
    name: "cdktn Unit Tests"
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci/run-unit/cdktn') }}
    uses: ./.github/workflows/unit.yml
    strategy:
      fail-fast: false
      matrix:
        terraform_version: ["1.6.5"]
    with:
      concurrency_group_prefix: pr-cdktn
      package: "cdktn"
      terraform_version: ${{ matrix.terraform_version }}
    secrets: inherit

  results:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Unit Tests - PR - Result
    needs:
      [
        determine-affected,
        all_unit_tests,
        cdktn,
        cdktn_cli,
        cdktn_provider_generator,
        cdktn_hcl2json,
        cdktn_hcl2cdk,
        cdktn_commons,
        cdktn_cli_core,
      ]
    steps:
      - run: exit 1
        if: >-
          ${{
               contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
          }}
