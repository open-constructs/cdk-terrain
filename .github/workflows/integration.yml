name: Integration Tests
on:
  workflow_call:
    inputs:
      skip_setup:
        description: Skip the version and build step and use parent
        default: false
        required: false
        type: boolean
      concurrency_group_prefix:
        default: pr
        required: false
        type: string
      dist_artifact_name:
        description: Name of the dist artifact created
        default: dist-integration
        required: false
        type: string
      edge_bindings_artifact_name:
        description: Name of the edge provider bindings artifact created
        default: edge-provider-bindings
        required: false
        type: string

env:
  HUSKY: "0"

concurrency:
  group: ${{ inputs.concurrency_group_prefix }}-integration-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  prepare-integration-tests:
    runs-on: depot-ubuntu-24.04-4
    outputs:
      tests: ${{ steps.build-test-matrix.outputs.tests }}
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    env:
      CHECKPOINT_DISABLE: "1"
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: "Add Git safe.directory" # Go 1.18+ started embedding repo info in the build and e.g. building @cdktn/hcl2json fails without this
        run: git config --global --add safe.directory /__w/cdk-terrain/cdk-terrain
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      # Setup cache for go
      - name: Get cache directory paths
        id: global-cache-dir-path
        run: |
          mkdir -p /usr/local/share/.cache/go
          echo "go=/usr/local/share/.cache/go" >> $GITHUB_OUTPUT
      - name: Cache go
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.global-cache-dir-path.outputs.go }}
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-integration
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-
      - name: install dependencies
        run: pnpm ci
      - name: build and package
        if: ${{ !inputs.skip_setup }}
        run: |
          pnpm run build
          pnpm run package
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GOCACHE: ${{ steps.global-cache-dir-path.outputs.go }}
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.skip_setup }}
        with:
          name: ${{ inputs.dist_artifact_name }}
          path: dist
      - name: Upload edge-provider bindings
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.skip_setup }}
        with:
          name: ${{ inputs.edge_bindings_artifact_name }}
          path: packages/@cdktn/provider-generator/edge-provider-bindings
      - name: installing test dependencies
        run: cd test && pnpm ci
      - name: Build test matrix
        id: build-test-matrix
        run: node tools/build-test-matrix.mjs

  linux_integration:
    needs: prepare-integration-tests
    runs-on: depot-ubuntu-24.04-4
    strategy:
      fail-fast: false
      matrix: ${{fromJSON(needs.prepare-integration-tests.outputs.tests)}}
      max-parallel: 30 # too many in parallel will give HTTP 429 errors from GH when checking out the source for example
    container:
      image: ghcr.io/open-constructs/jsii-terraform@sha256:c46ac91c8be20947a2b0e27a517eb4a5bfc015c16a27341876ed0b04d734ddf5
    env:
      CHECKPOINT_DISABLE: "1"
      TERRAFORM_VERSION: ${{ matrix.terraform }}
      GITHUB_API_TOKEN_CDKTF: ${{ secrets.GITHUB_TOKEN }}
      SYNTH_HCL_OUTPUT: ${{ matrix.hclOutput }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: ensure correct user
        run: chown -R root /__w/cdk-terrain
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      # Setup caches for terraform, go, and gradle
      - name: Get cache directory paths
        id: global-cache-dir-path
        run: |
          mkdir -p /usr/local/share/.cache/terraform
          echo "terraform=/usr/local/share/.cache/terraform" >> $GITHUB_OUTPUT
          mkdir -p /usr/local/share/.cache/go
          echo "go=/usr/local/share/.cache/go" >> $GITHUB_OUTPUT
          mkdir -p /usr/local/share/.cache/gradle
          echo "gradle=/usr/local/share/.cache/gradle" >> $GITHUB_OUTPUT
      - name: Cache terraform
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.global-cache-dir-path.outputs.terraform }}
          key: terraform-${{ runner.os }}-${{ matrix.terraform }}-integration
          restore-keys: |
            terraform-${{ runner.os }}-${{ matrix.terraform }}-
      - name: Cache go
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.global-cache-dir-path.outputs.go }}
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-integration
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-
      - name: Cache gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # Skip daemon/, notifications/, native/ — only the distribution + module jars are worth keeping
          path: |
            ${{ steps.global-cache-dir-path.outputs.gradle }}/caches/modules-2
            ${{ steps.global-cache-dir-path.outputs.gradle }}/wrapper/dists
          key: gradle-${{ runner.os }}-integration
          restore-keys: gradle-${{ runner.os }}-
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist_artifact_name }}
          path: dist
      - name: Download edge-provider bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.edge_bindings_artifact_name }}
          path: test/edge-provider-bindings
      - name: install test dependencies
        run: cd test && pnpm ci
      - name: integration tests
        run: cd test && ./run-against-dist.mjs pnpm exec jest ${TEST_TARGET}
        env:
          TEST_TARGET: ${{ matrix.target }}
          TERRAFORM_CLOUD_TOKEN: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}
          TERRAFORM_BINARY_NAME: "terraform${{ matrix.terraform }}"
          NODE_OPTIONS: "--max-old-space-size=7168"
          TF_PLUGIN_CACHE_DIR: ${{ steps.global-cache-dir-path.outputs.terraform }}
          GOCACHE: ${{ steps.global-cache-dir-path.outputs.go }}
          GRADLE_USER_HOME: ${{ steps.global-cache-dir-path.outputs.gradle }}

  windows_integration:
    needs: prepare-integration-tests
    runs-on: windows-2022
    if: false # Ignore windows integration tests for release atm
    strategy:
      fail-fast: false
      matrix: ${{fromJSON(needs.prepare-integration-tests.outputs.tests)}}
      max-parallel: 30 # too many in parallel will give HTTP 429 errors from GH when checking out the source for example
    env:
      CHECKPOINT_DISABLE: "1"
      TERRAFORM_VERSION: ${{ matrix.terraform }}
      GITHUB_API_TOKEN_CDKTF: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Setup corepack-managed pnpm
        uses: ./.github/actions/setup-corepack-pnpm
      # Setup caches for terraform, and go
      - name: Get cache directory paths
        id: global-cache-dir-path
        run: |
          mkdir -p /usr/local/share/.cache/terraform
          echo "terraform=/usr/local/share/.cache/terraform" >> $GITHUB_OUTPUT
          mkdir -p /usr/local/share/.cache/go
          echo "go=/usr/local/share/.cache/go" >> $GITHUB_OUTPUT
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.global-cache-dir-path.outputs.terraform }}
          key: terraform-${{ runner.os }}-${{ matrix.terraform }}-integration
          restore-keys: |
            terraform-${{ runner.os }}-${{ matrix.terraform }}-
      - name: Cache go
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.global-cache-dir-path.outputs.go }}
          key: go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-integration
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('**/go.sum') }}-
            go-${{ runner.os }}-
      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false
          terraform_version: ${{ matrix.terraform }}
      - name: Install pipenv
        run: pip install pipenv
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.x
          cache: false # This is disabled because we don't have a go.sum file and setup-go expects it to use caching. Thus, caching is always broken anyways
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.dist_artifact_name }}
          path: dist
      - name: Download edge-provider bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.edge_bindings_artifact_name }}
          path: test/edge-provider-bindings
      # tmp fix for https://github.com/npm/cli/issues/4980
      - name: update npm
        run: npm install -g npm@8.12.1
      - name: install test dependencies
        run: cd test && pnpm ci
      - name: integration tests
        run: cd test && node run-against-dist.mjs pnpm exec jest --ci ${env:TEST_TARGET}
        env:
          TEST_TARGET: ${{ matrix.target }}
          TERRAFORM_CLOUD_TOKEN: ${{ secrets.TERRAFORM_CLOUD_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=7168"
          TF_PLUGIN_CACHE_DIR: ${{ steps.global-cache-dir-path.outputs.terraform }}
          GOCACHE: ${{ steps.global-cache-dir-path.outputs.go }}
