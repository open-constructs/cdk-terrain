name: npmscan

# Diffs pnpm-lock.yaml against the PR base with npmscan.com and flags known
# malware, new install scripts, changed tarball URLs or integrity hashes, and
# changed overrides. Warn-only: findings never fail the check. See #214.

on:
  pull_request:
    paths:
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: npmscan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: "npmscan dependency check"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # for the one report comment; fork PRs get a read-only token and use the job summary
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: NPMscan/npmscan-action@6e43c93b29e9a844ba3019dce3952d179886d379 # v1.3.1
        with:
          file: pnpm-lock.yaml
          mode: warn
          fail-on-error: false
